# Docker image with Android SDK pre-installed
image: mingc/android-build-box:latest

# Pipeline stages
stages:
  - test
  - build
  - release

# Cache Gradle dependencies to speed up builds
cache:
  key: ${CI_PROJECT_ID}
  paths:
    - .gradle/wrapper
    - .gradle/caches

# Gradle configuration
variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# Runs before every job - decodes and prepares keystore (only for build jobs)
before_script:
  - |
    if [ -n "$KEYSTORE_FILE" ]; then
      echo $KEYSTORE_FILE | base64 -d > my-release-key.keystore
      export KEYSTORE_PATH=$(pwd)/my-release-key.keystore
    fi

# Job: Run unit tests (runs on all commits and tags)
test:
  stage: test
  script:
    - chmod +x ./gradlew
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: app/build/test-results/test*/TEST-*.xml
  allow_failure: true

# Job: Build signed release APK (only on tags)
build_release:
  stage: build
  script:
    - chmod +x ./gradlew
    - ./gradlew assembleRelease
      -Pandroid.injected.signing.store.file=$KEYSTORE_PATH
      -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD
      -Pandroid.injected.signing.key.alias=$KEY_ALIAS
      -Pandroid.injected.signing.key.password=$KEY_PASSWORD
    # Extract version info from build.gradle.kts
    - export VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
    - export VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | sed 's/.*= \(.*\)/\1/')
    # Rename APK to include version for F-Droid
    - mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/AirheadWaves-${VERSION_NAME}-${VERSION_CODE}.apk
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 90 days
  only:
    - tags

# Job: Create GitLab Release (only on tags, after successful build)
create_release:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache curl git jq gettext
  script:
    # Extract version info
    - export VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
    - export VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | sed 's/.*= \(.*\)/\1/')
    - export APK_NAME="AirheadWaves-${VERSION_NAME}-${VERSION_CODE}.apk"
    # Get tag message
    - export TAG_MESSAGE=$(git tag -l --format='%(contents)' $CI_COMMIT_TAG || echo "")
    # Create release notes with F-Droid download link
    - |
      cat > release_notes.md <<'EOF'
      ${TAG_MESSAGE}

      ---

      **Download:** [${APK_NAME}](${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/app/build/outputs/apk/release/${APK_NAME}?job=build_release)
      EOF
    # Expand variables in release notes
    - export RELEASE_DESCRIPTION=$(cat release_notes.md | envsubst)
    # Get the build_release job ID from this pipeline
    - export BUILD_JOB_ID=$(curl -s --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/jobs" | jq -r '.[] | select(.name == "build_release") | .id')
    - echo "Build job ID: ${BUILD_JOB_ID}"
    # Create APK download URL
    - export APK_URL="${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/app/build/outputs/apk/release/${APK_NAME}"
    - echo "APK URL: ${APK_URL}"
    # Create release JSON payload
    - 'jq -n --arg name "Release ${VERSION_NAME}" --arg tag "${CI_COMMIT_TAG}" --arg desc "Download the APK from the link below." --arg apk_name "${APK_NAME}" --arg apk_url "${APK_URL}" ''{name: $name, tag_name: $tag, description: $desc, assets: {links: [{name: $apk_name, url: $apk_url, link_type: "package"}]}}'' > release.json'
    - cat release.json
    # Create the release using curl with JOB-TOKEN header
    - curl --fail --request POST --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --header "Content-Type: application/json" --data @release.json "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
  dependencies:
    - build_release
  only:
    - tags
